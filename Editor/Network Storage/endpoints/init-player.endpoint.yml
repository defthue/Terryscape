sourceVersion: 1
kind: endpoint
id: init-player
name: "Initialize Player"
description: "Create the first-time player row across all 8 collections with default values"
method: "POST"
enabled: true
input:
  properties:
    playerName:
      type: "string"
  required: []
  type: "object"
steps:
  -
    collection: "players"
    id: "save_players"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "version"
        value: 1
      -
        op: "set"
        path: "savedAt"
        value: ""
      -
        op: "set"
        path: "playerName"
        value: "{{input.playerName}}"
      -
        op: "set"
        path: "currency"
        value: 0
      -
        op: "set"
        path: "currentMana"
        value: -1
      -
        op: "set"
        path: "totalLevel"
        value: 0
      -
        op: "set"
        path: "totalGold"
        value: 0
      -
        op: "set"
        path: "totalKills"
        value: 0
      -
        op: "set"
        path: "nodesMined"
        value: 0
      -
        op: "set"
        path: "inventoryExpansions"
        value: 0
      -
        op: "set"
        path: "equippedAmmoId"
        value: "None"
      -
        op: "set"
        path: "equippedAmmoQty"
        value: 0
      -
        op: "set"
        path: "equippedAmmoSlotIndex"
        value: 0
    type: "write"
  -
    collection: "skills"
    id: "save_skills"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "entries"
        value: {}
    type: "write"
  -
    collection: "inventory"
    id: "save_inventory"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "slots"
        value: []
    type: "write"
  -
    collection: "equipment"
    id: "save_equipment"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "equipped"
        value: {}
      -
        op: "set"
        path: "equippedSlotIndices"
        value: {}
    type: "write"
  -
    collection: "bank"
    id: "save_bank"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "stackables"
        value: {}
    type: "write"
  -
    collection: "bank_unique"
    id: "save_bank_unique"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "items"
        value: []
    type: "write"
  -
    collection: "progression"
    id: "save_progression"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "recipes"
        value: []
      -
        op: "set"
        path: "stones"
        value: []
      -
        op: "set"
        path: "quests"
        value: []
      -
        op: "set"
        path: "discoveredQuests"
        value: []
      -
        op: "set"
        path: "unlockedSpells"
        value: []
      -
        op: "set"
        path: "chestClaims"
        value: {}
    type: "write"
  -
    collection: "kills"
    id: "save_kills"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "counts"
        value: {}
    type: "write"
response:
  body:
    initialized: true
    ok: true
  status: 200
