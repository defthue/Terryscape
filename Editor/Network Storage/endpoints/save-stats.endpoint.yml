sourceVersion: 1
kind: endpoint
id: save-stats
name: "Save Stats"
description: "Writes the players collection fields and updates the global leaderboard entry for this player"
method: "POST"
enabled: true
input:
  properties:
    currency:
      type: "number"
    currentMana:
      type: "number"
    equippedAmmoId:
      type: "string"
    equippedAmmoQty:
      type: "number"
    equippedAmmoSlotIndex:
      type: "number"
    inventoryExpansions:
      type: "number"
    nodesMined:
      type: "number"
    playerName:
      type: "string"
    savedAt:
      type: "string"
    totalGold:
      type: "number"
    totalKills:
      type: "number"
    totalLevel:
      type: "number"
  required: []
  type: "object"
steps:
  -
    collection: "players"
    id: "save"
    key: "{{steamId}}_default"
    ops:
      -
        op: "set"
        path: "savedAt"
        value: "{{input.savedAt}}"
      -
        op: "set"
        path: "playerName"
        value: "{{input.playerName}}"
      -
        op: "set"
        path: "currency"
        value: "{{input.currency}}"
      -
        op: "set"
        path: "currentMana"
        value: "{{input.currentMana}}"
      -
        op: "set"
        path: "totalLevel"
        value: "{{input.totalLevel}}"
      -
        op: "set"
        path: "totalGold"
        value: "{{input.totalGold}}"
      -
        op: "set"
        path: "totalKills"
        value: "{{input.totalKills}}"
      -
        op: "set"
        path: "nodesMined"
        value: "{{input.nodesMined}}"
      -
        op: "set"
        path: "inventoryExpansions"
        value: "{{input.inventoryExpansions}}"
      -
        op: "set"
        path: "equippedAmmoId"
        value: "{{input.equippedAmmoId}}"
      -
        op: "set"
        path: "equippedAmmoQty"
        value: "{{input.equippedAmmoQty}}"
      -
        op: "set"
        path: "equippedAmmoSlotIndex"
        value: "{{input.equippedAmmoSlotIndex}}"
    type: "write"
  -
    collection: "leaderboard_global"
    id: "save_leaderboard"
    key: "default"
    ops:
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.steamId"
        value: "{{steamId}}"
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.playerName"
        value: "{{input.playerName}}"
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.totalLevel"
        value: "{{input.totalLevel}}"
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.totalGold"
        value: "{{input.totalGold}}"
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.totalKills"
        value: "{{input.totalKills}}"
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.nodesMined"
        value: "{{input.nodesMined}}"
      -
        op: "set"
        path: "entriesByPlayer.{{steamId}}.updatedAt"
        value: "{{input.savedAt}}"
    type: "write"
response:
  body:
    ok: true
  status: 200
